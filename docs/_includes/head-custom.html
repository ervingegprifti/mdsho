<!-- Turns ```mermaid code blocks into diagrams (github.com renders them itself; GitHub Pages does not). -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  async function renderMermaid() {
    // Kramdown + Rouge wrap a mermaid block as <div class="language-mermaid ..."><div class="highlight"><pre><code>.
    const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
    blocks.forEach((block) => {
      const host = block.tagName === "CODE" ? block.parentElement : block;
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      host.replaceWith(diagram);
    });
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderMermaid);
  } else {
    renderMermaid();
  }
</script>
