name: build

# Runs on pull requests only: main takes changes only through pull requests, so a run after a merge would repeat one.
# "labeled" and "unlabeled" run it again when the "skip tests" label is added or removed.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new run for the same pull request stops the one still running.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # The "skip tests" label skips the job. A skipped job counts as passed, so the required check still lets it merge.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip tests') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only docs changed (docs/, any .md file, LICENSE): the steps below are skipped and the check passes.
      - name: Check for code changes
        id: changes
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          if git diff --name-only "$base...$head" | grep -qvE '^docs/|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed: build and tests skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v5
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      # MDSHO.Cli.slnf excludes the MSIX packaging project (MDSHO.Package.wapproj),
      # which the dotnet CLI cannot build.
      - run: dotnet restore MDSHO.Cli.slnf
        if: steps.changes.outputs.code == 'true'

      - run: dotnet build MDSHO.Cli.slnf -c Release --no-restore
        if: steps.changes.outputs.code == 'true'

      # The opt-in real-database test is skipped unless its environment variable is set.
      - run: dotnet test MDSHO.Cli.slnf -c Release --no-build
        if: steps.changes.outputs.code == 'true'
